name: Instagram autopost

on:
  schedule:
    - cron: '*/15 6-20 * * *'     # every 15 minutes, 06:00–20:59 UTC (covers 07:00–21:59 in BST and GMT)
                                  # GitHub runs this late or not at all at busy times; the Mac's own timer
                                  # (tools/setup-mac-timer.sh) starts the job on time, and this stays as a backup
  workflow_dispatch:
    inputs:
      mode:
        description: 'check, dry-run or post'
        default: 'dry-run'

permissions:
  contents: write    # to save posted.json
  issues: write      # to open an issue (and email you) when something needs doing by hand

concurrency:
  # Renamed from "autopost" on 11 Nov 2026: a run GitHub left half-started (shows as queued, can't be cancelled)
  # was holding the old group, so every later run waited behind it.
  group: autopost-posting
  cancel-in-progress: false

jobs:
  post:
    # Runs on Cameron's own machine (a self-hosted runner with the label "autopost": the Mac now, a Raspberry Pi
    # later), so posts reach Instagram from his home connection rather than GitHub's shared servers. Set up with
    # tools/setup-mac-runner.sh. If no such runner is online, the run waits; the next one replaces it.
    runs-on: [self-hosted, autopost]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Post what is due
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          WINDOW_HOURS: '12'   # GitHub's timer can skip hours at a time: a late post still goes out rather than being skipped
          REPORT_FILE: report.md
          # Passed as a variable, never pasted into the script, so no input can run commands on the Mac.
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$MODE" = "check" ]; then python3 publish.py --check
          elif [ "$MODE" = "dry-run" ]; then python3 publish.py --dry-run
          else python3 publish.py; fi
      - name: Save what was posted
        if: always()
        run: |
          git config user.name "autopost"; git config user.email "autopost@users.noreply.github.com"
          git add -u; git add posted.json $(ls pause.json 2>/dev/null)     # pause.json appears when Meta blocks access, and goes after a good "check"
          git diff --cached --quiet || (git commit -m "Posted $(date -u +%Y-%m-%dT%H:%MZ)" && (git push || (git pull --rebase && git push)))
      - name: Tell Cameron if something needs doing by hand
        if: always() && hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime as dt
          from zoneinfo import ZoneInfo
          when = dt.datetime.now(ZoneInfo('Europe/London')).strftime('%a %d %b %H:%M')
          issue = {'title': f'Instagram – something to do by hand ({when})',
                   'body': open('report.md', encoding='utf-8').read()}
          req = urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues",
                                       data=json.dumps(issue).encode(), method='POST',
                                       headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                                                'Accept': 'application/vnd.github+json'})
          urllib.request.urlopen(req, timeout=30).read()
          PY
          rm -f report.md
