name: Hub feed

# Links this repository to Cameron's private hub: posts the comment replies he pressed
# "Send" on, merges the pull requests he approved there, and sends the hub Instagram's numbers and the comments
# still waiting for a reply. See tools/hub_feed.py. The hub starts a run straight after a click (if the website
# repository has HUB_DISPATCH_TOKEN), and this timer catches up every two hours during the day.

on:
  schedule:
    - cron: '41 6-20/2 * * *'     # 06:41, 08:41 … 20:41 UTC
  workflow_dispatch:

permissions:
  contents: write        # merging a pull request approved in the hub
  pull-requests: write   # closing one declined in the hub

concurrency:
  group: hub-feed
  cancel-in-progress: false

jobs:
  feed:
    # Same machine as the autopost, so every call to Instagram comes from one home address.
    runs-on: [self-hosted, autopost]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swap news with the hub
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          HUB_SYNC_TOKEN: ${{ secrets.HUB_SYNC_TOKEN }}
          HUB_URL: ${{ secrets.HUB_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$HUB_SYNC_TOKEN" ] || [ -z "$HUB_URL" ]; then
            echo "The hub isn't set up here yet: add the secrets HUB_SYNC_TOKEN and HUB_URL (see tools/hub_feed.py)."
            exit 0
          fi
          python3 tools/hub_feed.py
